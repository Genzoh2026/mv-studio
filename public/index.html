<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>MV Studio</title>
<link rel="stylesheet" href="/vendor/xterm.css">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<nav id="rail" aria-label="ツール">
  <div class="rail-tools"></div>
  <div class="rail-bottom">
    <div class="rail-tools rail-tools-bottom"></div>
    <button type="button" class="rail-collapse" title="バーを畳む" aria-label="バーを畳む">‹</button>
  </div>
</nav>
<aside id="term"></aside>
<div id="splitter" role="separator" aria-orientation="vertical" aria-label="ターミナルの幅" tabindex="0" title="ドラッグで幅を変更(ダブルクリックで元に戻す)"></div>
<main>
  <header id="lib-header">
    <h1>PJ一覧</h1>
    <input id="lib-filter" placeholder="絞り込み" autocomplete="off" aria-label="PJ を絞り込み">
    <form id="new-pj">
      <input id="new-name" placeholder="新規 MV 名(日付は自動)" maxlength="64" autocomplete="off">
      <button>+ 新規</button>
    </form>
  </header>
  <header id="pj-header" hidden>
    <button id="back" type="button">← PJ一覧</button>
    <strong id="pj-title"></strong>
  </header>
  <nav id="tabs" hidden>
    <button type="button" data-tab="drafts">歌詞・スタイル・設定</button>
    <button type="button" data-tab="songs">曲ライブラリ</button>
    <button type="button" data-tab="images">画像ライブラリ</button>
    <button type="button" data-tab="videos">動画ライブラリ</button>
  </nav>
  <div id="lib-bar" hidden></div>
  <section id="library"></section>
  <section id="drafts" hidden></section>
  <section id="songs" hidden></section>
  <section id="images" hidden></section>
  <section id="videos" hidden></section>
  <div id="job-bar" hidden></div>
  <div id="toasts" aria-live="polite"></div>
</main>
<section id="rail-panel" hidden>
  <header><strong class="panel-title"></strong><button type="button" class="panel-close" aria-label="閉じる">✕</button></header>
  <div class="panel-body"></div>
</section>
<button type="button" id="rail-handle" title="ツールバーを開く" aria-label="ツールバーを開く">›</button>
<script src="/vendor/xterm.js"></script>
<script src="/vendor/fit.js"></script>
<script type="module" src="/app.js"></script>
</body>
</html>
